name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install project dependencies
        run: npm ci --prefix projects/distributed-simulator && npm ci --prefix projects/async-job-queue && npm ci --prefix projects/book-librarian && npm ci --prefix projects/mock-interview && npm ci --prefix projects/card-fit
      # Default `/` matches custom domains and GitHub Pages “root” hosting. If you use only
      # https://<user>.github.io/<repo>/ (no custom domain), set Actions variable VITE_PAGES_BASE=/<repo>/
      - name: Set VITE_PAGES_BASE for GitHub Pages
        env:
          OVERRIDE: ${{ vars.VITE_PAGES_BASE }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            BASE="$OVERRIDE"
          else
            BASE="/"
          fi
          echo "VITE_PAGES_BASE=$BASE" >> "$GITHUB_ENV"
          echo "Using VITE_PAGES_BASE=$BASE"
      - name: Build site and demos
        env:
          VITE_GITHUB_REPO: https://github.com/${{ github.repository }}
          # Optional repo variable: Settings → Secrets and variables → Actions → Variables → REWARD_OPTIMIZER_DEMO
          VITE_REWARD_OPTIMIZER_DEMO: ${{ vars.REWARD_OPTIMIZER_DEMO }}
        run: npm run build:all
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
